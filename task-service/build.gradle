plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.taskflow'
version = '0.0.1-SNAPSHOT'
description = 'task-service'

// Override Spring Boot BOM: Testcontainers 1.21.x uses Docker API ≥ 1.41 for its
// initial compatibility check; Docker Desktop 4.74+ rejects the 1.32 probe used in 1.20.x.
ext['testcontainers.version'] = '1.21.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // standalone variant shades Jetty 11 to avoid conflict with Spring Boot's Jetty 12 BOM
    testImplementation 'org.wiremock:wiremock-standalone:3.3.1'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    runtimeOnly      'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.3'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
}

tasks.named('test') {
    useJUnitPlatform()
    // Docker Desktop 4.74+ requires Docker API >= 1.40; Testcontainers falls back to 1.32
    // when the api.version is UNKNOWN. Setting it via system property prevents the fallback.
    systemProperty 'api.version', '1.45'
}
