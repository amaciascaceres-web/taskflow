spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:taskflow_users}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}

jwt:
  secret: ${JWT_SECRET:dev-secret-min-32-chars-long-ok!}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always