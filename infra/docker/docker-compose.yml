version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER:     taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-network

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - taskflow-network

  user-service:
    build:
      context: ../../user-service
      dockerfile: Dockerfile
    container_name: taskflow-user-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     taskflow_users
      DB_USER:     taskflow
      DB_PASSWORD: taskflow
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - taskflow-network

  notification-service:
    build:
      context: ../../notification-service
      dockerfile: Dockerfile
    container_name: taskflow-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - taskflow-network

  task-service:
    build:
      context: ../../task-service
      dockerfile: Dockerfile
    container_name: taskflow-task-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     taskflow
      DB_USER:     taskflow
      DB_PASSWORD: taskflow
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      USER_SERVICE_URL:         http://user-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - taskflow-network

  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    container_name: taskflow-gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TASK_SERVICE_URL: http://task-service:8080
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "8090:8090"
    depends_on:
      task-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - taskflow-network

volumes:
  postgres-data:

networks:
  taskflow-network:
    driver: bridge
